# Runtime dependencies omitted by upstream TTS package declarations. These are
# installed independently and passed to audio.cpp through absolute session paths.
package_dependencies:
  miotts_1_7b_q8_0: &miotts_codec_dependency
    - id: miocodec_q8_0
      family: miocodec
      display_name: "MioCodec 25Hz 44.1kHz v2 Q8_0 GGUF"
      target_directory: "MioCodec-25Hz-44.1kHz-v2-GGUF"
      format: gguf
      precision: q8_0
      files: ["MioCodec-25Hz-44.1kHz-v2-GGUF/miocodec-25hz-44khz-v2-q8_0.gguf"]
      strip_prefix: "MioCodec-25Hz-44.1kHz-v2-GGUF"
      repo: "audio-cpp/audio.cpp-gguf"
      revision: main
      estimated_download_bytes: 299066464
      session_option: "miotts.codec_model_path"
  miotts_1_7b_bf16: *miotts_codec_dependency
  miotts_1_7b_orig: *miotts_codec_dependency

# Suite-owned UI and validation metadata. Download/package truth remains in
# model_specs/*.json, which are unmodified snapshots of audio.cpp.
defaults:
  suite_support: supported
  suite_tasks: [tts, srt, character_switching]
  reference_audio: none
  reference_transcript: none
  built_in_voices: false
  voice_design: false
  inline_controls: false
  native_multi_speaker: {supported: false, max_speakers: 1, suite_status: unavailable}
  asr_features: {diarization: none, timing: none}

families:
  citrinet_asr:
    suite_tasks: [asr]
    summary: "Compact English transcription using a Citrinet CTC model."
  chatterbox:
    reference_audio: required
    suite_tasks: [tts, srt, character_switching, voice_conversion]
    summary: "Voice cloning and reference-targeted voice conversion."
  confucius4_tts: {reference_audio: required, summary: "Voice cloning from reference audio."}
  dramabox: {reference_audio: optional, summary: "TTS and optional voice cloning."}
  fish_audio: {reference_audio: optional, summary: "Reference-conditioned TTS."}
  fun_asr_nano:
    suite_tasks: [asr]
    summary: "Multilingual speech recognition for Chinese, English, and Japanese."
  glm_tts:
    reference_audio: required
    reference_transcript: required
    summary: "Zero-shot cloning; reference audio and its transcript are required."
  higgs_audio_tts:
    reference_audio: optional
    reference_transcript: optional
    inline_controls: true
    summary: "Expressive multilingual TTS, cloning, and inline style/sound controls."
  higgs_audio_stt:
    suite_tasks: [asr]
    summary: "English transcription using the Higgs Audio v3 speech model."
  hviske_asr:
    suite_tasks: [asr]
    summary: "Multilingual transcription across 16 languages."
  index_tts2: {reference_audio: optional, summary: "TTS with optional voice cloning."}
  inflect_v2: {summary: "Reference-free expressive TTS."}
  irodori_tts:
    reference_audio: optional
    voice_design: true
    summary: "TTS, optional cloning, and voice design."
  kroko_asr:
    suite_tasks: [asr]
    asr_features: {timing: native_word}
    summary: "Small multilingual community ASR model."
  miotts: {reference_audio: optional, summary: "Reference-conditioned TTS."}
  moss_tts_local: {reference_audio: optional, summary: "TTS with optional voice cloning."}
  moss_tts_nano: {reference_audio: optional, summary: "Compact TTS with optional cloning."}
  nemotron_asr:
    suite_tasks: [asr]
    asr_features: {timing: native_word}
    summary: "Streaming-capable multilingual NVIDIA Nemotron transcription."
  omnivoice:
    reference_audio: optional
    reference_transcript: optional
    voice_design: true
    summary: "Reference cloning or instruction-based voice design."
  outetts:
    reference_audio: optional
    reference_transcript: optional
    summary: "Multilingual TTS; a transcript improves reference cloning."
  parakeet_tdt:
    suite_tasks: [asr]
    asr_features: {timing: native_word}
    summary: "Fast multilingual Parakeet-TDT transcription."
  pocket_tts: {reference_audio: optional, summary: "Small CPU-friendly TTS and cloning."}
  qwen3_tts:
    reference_audio: optional
    voice_design: true
    summary: "TTS with package-dependent cloning or voice design."
  qwen3_asr:
    suite_tasks: [asr]
    asr_features: {timing: optional_forced_aligner}
    summary: "Broad multilingual Qwen3 transcription; word timestamps require an optional forced aligner."
  seed_vc:
    suite_tasks: [voice_conversion]
    reference_audio: required
    summary: "Reference-targeted voice conversion through Seed-VC."
  supertonic:
    built_in_voices: true
    summary: "Fast multilingual TTS using built-in voices."
  vevo2:
    reference_audio: optional
    suite_tasks: [tts, srt, character_switching, voice_conversion]
    summary: "TTS and reference-targeted voice conversion; S2S/SVC remain advanced upstream routes."
  vibevoice:
    reference_audio: required_per_speaker
    native_multi_speaker: {supported: true, max_speakers: 4, suite_status: partial}
    summary: "Long-form dialogue for up to four speakers. Native single-request mode is not wired yet."
  vibevoice_asr:
    suite_tasks: [asr, diarization]
    asr_features: {diarization: native, timing: native_segment}
    summary: "Multilingual transcription with native timestamped speaker turns."
  vietneu_tts:
    voice_design: true
    summary: "Vietnamese TTS and voice design."
  voxcpm2:
    reference_audio: optional
    voice_design: true
    summary: "TTS with reference conditioning and voice design."
  voxtral_realtime:
    suite_tasks: [asr]
    summary: "Multilingual realtime-oriented Voxtral transcription."
